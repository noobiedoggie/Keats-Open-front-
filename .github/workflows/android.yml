name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - "openfront-autopilot.user.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: android
        # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME is set).
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../OpenFrontAutopilot.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFrontAutopilot-apk
          path: OpenFrontAutopilot.apk

      # A rolling "latest" release so the APK can be downloaded straight from a
      # phone browser, no GitHub login or unzipping needed.
      - name: Move the android-latest tag to this commit
        run: |
          git tag -f android-latest
          git push -f origin android-latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: OpenFront Autopilot – Android (latest build)
          prerelease: true
          make_latest: false
          files: OpenFrontAutopilot.apk
          body: |
            Latest Android build of OpenFront Autopilot from `${{ github.ref_name }}` (${{ github.sha }}).

            **Install:** download `OpenFrontAutopilot.apk` on your phone, open it, and allow
            "Install unknown apps" for your browser when Android asks.
